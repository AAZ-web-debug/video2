<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="vestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="200" cy="230" r="140" fill="url(#glowGrad)" opacity="0.12" filter="url(#neonGlow)" />

  <!-- Body / Shoulders -->
  <path d="M 120 440 C 120 350, 150 320, 200 320 C 250 320, 280 350, 280 440 Z" fill="#1E293B" stroke="#334155" stroke-width="3" />
  <!-- Tech Vest -->
  <path d="M 140 440 L 155 330 C 170 345, 230 345, 245 330 L 260 440 Z" fill="url(#vestGrad)" stroke="#60A5FA" stroke-width="2.5" />
  <!-- Vest Neon Piping -->
  <line x1="165" y1="340" x2="155" y2="440" stroke="#38BDF8" stroke-width="3" filter="url(#neonGlow)" />
  <line x1="235" y1="340" x2="245" y2="440" stroke="#38BDF8" stroke-width="3" filter="url(#neonGlow)" />

  <!-- Neck -->
  <rect x="186" y="275" width="28" height="50" rx="6" fill="#FCD34D" />
  <path d="M 186 310 Q 200 322 214 310" stroke="#F59E0B" stroke-width="2" fill="none" />

  <!-- Head Base -->
  <ellipse cx="200" cy="220" rx="55" ry="65" fill="#FCD34D" />

  <!-- Hair Back / Ponytail -->
  <path d="M 150 190 C 130 140, 160 90, 220 95 C 270 100, 275 160, 260 210 C 240 180, 160 170, 150 190 Z" fill="#1E1B4B" />
  <path d="M 235 150 C 290 140, 310 190, 290 230 C 275 220, 260 175, 235 150 Z" fill="#1E1B4B" />

  <!-- Hair Bangs / Front -->
  <path d="M 145 190 C 160 140, 220 135, 255 175 C 245 160, 210 155, 185 175 C 170 185, 155 185, 145 190 Z" fill="#2563EB" />

  <!-- Eyes -->
  <ellipse cx="178" cy="222" rx="7" ry="10" fill="#0F172A" />
  <ellipse cx="222" cy="222" rx="7" ry="10" fill="#0F172A" />
  <!-- Eye highlights -->
  <circle cx="176" cy="219" r="3" fill="#FFFFFF" />
  <circle cx="220" cy="219" r="3" fill="#FFFFFF" />
  <!-- Cyan Eye Tint -->
  <circle cx="179" cy="224" r="2.5" fill="#38BDF8" />
  <circle cx="223" cy="224" r="2.5" fill="#38BDF8" />

  <!-- Eyebrows (friendly, inquisitive) -->
  <path d="M 168 206 Q 178 201 188 207" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 212 207 Q 222 201 232 206" stroke="#1E1B4B" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M 200 226 L 197 236 L 204 236" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Smile -->
  <path d="M 188 252 Q 200 264 212 252" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Holographic Ear-Comm / Guide Earring -->
  <rect x="140" y="215" width="6" height="18" rx="3" fill="#06B6D4" filter="url(#neonGlow)" />
  <rect x="254" y="215" width="6" height="18" rx="3" fill="#06B6D4" filter="url(#neonGlow)" />

  <!-- Guide Badge / AlgoVerse Crest -->
  <polygon points="200,345 208,358 192,358" fill="#38BDF8" filter="url(#neonGlow)" />
  <circle cx="200" cy="354" r="2" fill="#FFFFFF" />
</svg>
